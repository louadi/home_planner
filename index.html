<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="description" content="Weekly home planner: fair task splitting for two people, tablet-first and offline.">
<title>Home Planner</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-mark">H</div>
    <p>Loading your plan…</p>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="btn-prev-week" type="button" aria-label="Previous week"></button>
      <button class="week-pill" id="week-pill" type="button">
        <span class="week-pill-main" id="week-pill-main">Week</span>
        <span class="week-pill-sub" id="week-pill-sub">—</span>
      </button>
      <button class="icon-btn" id="btn-next-week" type="button" aria-label="Next week"></button>
      <button class="today-chip" id="btn-jump-today" type="button" hidden>Jump to now</button>
    </div>
    <div class="topbar-right">
      <span class="save-dot" id="save-dot" title="All changes saved"></span>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="More actions"></button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" role="tablist"></nav>
</div>

<div id="toast-host" class="toast-host" aria-live="polite"></div>

<noscript>
  <div style="padding:24px;font-family:system-ui">
    This planner needs JavaScript enabled.
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
